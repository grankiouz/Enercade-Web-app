<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selettore CER / CACER — Enercade</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito Sans', sans-serif; background: rgb(245,246,248); min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Topbar ── */
    .topbar {
      position: fixed; left: 0; top: 0; right: 0; height: 64px;
      background: #fff; box-shadow: 0 2px 20px rgba(0,0,0,0.05);
      display: flex; align-items: center; padding: 0 32px; gap: 16px; z-index: 10;
    }
    .logo { width: 32px; height: 32px; background: rgb(6,101,62); border-radius: 8px; flex-shrink: 0; }
    .logo-name { font-weight: 800; font-size: 16px; color: rgb(0,27,16); }
    .topbar-nav { display: flex; align-items: center; gap: 4px; margin-left: 32px; }
    .nav-item { padding: 6px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; color: rgb(111,124,119); cursor: pointer; }
    .nav-item:hover { background: rgb(245,246,248); }
    .nav-item.active { background: rgb(230,233,232); color: rgb(0,27,16); }
    .topbar-right { margin-left: auto; }
    .open-btn {
      display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px;
      background: rgb(6,101,62); color: #fff; border: none; border-radius: 88px;
      font-family: 'Nunito Sans', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .open-btn:hover { background: rgb(2,40,26); }

    /* ── Page body ── */
    .page-body {
      margin-top: 64px; padding: 32px; display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: 200px 200px 200px; gap: 20px; flex: 1;
    }
    .dash-card { background: #fff; border-radius: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.04); }
    .dash-card.tall { grid-row: span 2; }
    .dash-card.wide { grid-column: span 2; }

    /* ── Scrim ── */
    .scrim {
      position: fixed; inset: 0;
      background: rgba(0,14,9,0.35);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      z-index: 100; display: flex; align-items: flex-end; justify-content: center;
    }

    /* ── Modal ── */
    /* bg = rgb(245,246,248), width 1288, radius top 20 only — fixed height */
    .modal {
      position: relative;
      width: 1288px;
      max-width: calc(100vw - 40px);
      height: 673px;
      max-height: calc(100vh - 40px);
      background: rgb(245,246,248);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 0 20px rgba(0,27,16,0.10);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── pad 0/32/0/32, h 40, gap 10 */
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 32px 0;
      gap: 10px; flex-shrink: 0;
    }
    .modal-title {
      font-weight: 700; font-size: 19px; line-height: 26px;
      color: rgb(0,27,16); flex-shrink: 0;
    }
    .header-right {
      display: flex; align-items: center; gap: 48px;
    }
    /* Searchbar — 4 stati: default / hover / active / focus(tab) */
    .searchbar {
      width: 320px; height: 36px;
      display: flex; align-items: center; gap: 2px; /* icon↔input: 2px (Figma label gap) */
      padding: 8px 10px;
      background: #fff;
      border-radius: 100px;
      border: 2px solid transparent;
      box-shadow: 0 0 20px 2px rgba(0,0,0,0.06);
      transition: background 0.12s, box-shadow 0.12s, border-color 0.12s;
      overflow: hidden;
      cursor: text;
    }
    /* HOVER — solo se non è in corso un input (non is-active) */
    .searchbar:not(.is-active):hover { background: rgb(230,233,232); }
    /* ACTIVE — click o input tastiera: glow verde */
    .searchbar.is-active {
      box-shadow: 0 0 20px 2px rgba(15,169,105,0.15);
    }
    /* FOCUS (tab) — aggiunge bordo scuro, hover solo se non active */
    .searchbar.kb-focus { border-color: rgb(23,47,37); }
    .searchbar.kb-focus:not(.is-active):hover { background: rgb(230,233,232); }
    .searchbar-icon {
      width: 20px; height: 20px; flex-shrink: 0;
      color: rgb(111,124,119); /* default + focus: #6f7c77 */
      transition: color 0.12s;
      display: flex; align-items: center; justify-content: center;
    }
    /* hover (non active): icona scura #02281a */
    .searchbar:not(.is-active):hover .searchbar-icon { color: rgb(2,40,26); }
    /* active + input: icona verde #06653e */
    .searchbar.is-active .searchbar-icon { color: rgb(6,101,62); }
    /* Figma 40004414:25316 — font weights per stato:
       default / focus / input → Regular 400, tracking 0
       hover / active          → Bold 700, tracking 0.28px          */
    .searchbar input {
      flex: 1; border: none; outline: none; background: transparent;
      font-family: 'Nunito Sans', sans-serif; font-size: 14px;
      font-weight: 400; letter-spacing: 0;
      color: rgb(111,124,119);
      min-width: 0;
    }
    /* default placeholder: Regular 400, #6f7c77, tracking 0 */
    .searchbar input::placeholder {
      color: rgb(111,124,119); font-weight: 400; letter-spacing: 0;
    }
    /* hover placeholder: Bold 700, #02281a, tracking 0.28px — solo se non active */
    .searchbar:not(.is-active):hover input::placeholder {
      color: rgb(2,40,26); font-weight: 700; letter-spacing: 0.28px;
    }
    /* active: Bold 700, #06653e, tracking 0.28px */
    .searchbar.is-active input { color: rgb(6,101,62); font-weight: 700; letter-spacing: 0.28px; }
    .searchbar.is-active input::placeholder { color: rgb(6,101,62); font-weight: 700; letter-spacing: 0.28px; }
    /* focus (kb-focus): Regular 400, tracking 0 — invariato rispetto a default */
    /* input (has-input): Regular 400, #001b10, tracking 0 */
    .searchbar.has-input input {
      color: rgb(0,27,16); font-weight: 400; letter-spacing: 0;
    }
    /* Clear button — 28×28, p 6px, radius 100, nascosto di default */
    /* margin-left 8px: gap container 10px = gap flex 2px + margin 8px */
    .searchbar-clear {
      display: none; flex-shrink: 0;
      width: 28px; height: 28px; border-radius: 100px;
      border: none; background: transparent;
      align-items: center; justify-content: center;
      cursor: pointer; padding: 6px;
      margin-left: 8px;
      transition: background 0.12s;
    }
    .searchbar-clear:hover { background: rgb(230,233,232); }
    .searchbar.has-input .searchbar-clear { display: flex; }
    /* Close button: 40×40, radius 100 */
    .close-btn {
      width: 40px; height: 40px; border-radius: 100px; border: none;
      background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: rgb(111,124,119); transition: background 0.1s; flex-shrink: 0;
    }
    .close-btn:hover { background: rgb(230,233,232); color: rgb(0,27,16); }

    /* ── Main content: padding laterale tolto qui, gestito dai figli ── */
    .main-content {
      padding: 0; display: flex; flex-direction: column; gap: 24px;
      flex: 1; min-height: 0;
      margin-top: 32px;
    }

    /* ── CER section: gap 16, padding orizzontale proprio ── */
    .cer-section { display: flex; flex-direction: column; gap: 16px; flex-shrink: 0; padding: 0 32px; }

    /* "Cer (1 di 3)" — Bold 16px lh 27px color rgb(0,27,16) */
    .section-title {
      font-weight: 700; font-size: 16px; line-height: 27px;
      color: rgb(0,27,16);
    }

    /* Chips row: gap 24 */
    .cer-chips { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }

    /* Chip — Figma Controls/Chips Type=dot: h 44, pad 10/20, radius 100, gap 8 */
    .cer-chip {
      display: flex; align-items: center; gap: 8px;
      height: 44px; padding: 10px 20px;
      border-radius: 100px;
      background: #fff;
      box-shadow: 0 0 20px rgba(0,0,0,0.06);
      border: none; outline: none;
      cursor: pointer; user-select: none; flex-shrink: 0;
      font-family: 'Nunito Sans', sans-serif;
      transition: background 0.12s, box-shadow 0.12s;
    }
    /* hover: bg grigio, label scuro */
    .cer-chip:hover:not(.active) {
      background: rgb(230,233,232);
      box-shadow: 0 0 20px rgba(0,0,0,0.06);
    }
    .cer-chip:hover:not(.active) .chip-label { color: rgb(2,40,26); }
    /* selected: verde pieno, no shadow */
    .cer-chip.active { background: rgb(6,101,62); box-shadow: none; }
    /* focus (tab): focus-ring 2px scuro, 5px offset */
    .cer-chip:focus-visible {
      outline: 2px solid rgb(23,47,37);
      outline-offset: 3px;
    }
    /* Dot: 14×14, border bianco 1.5px per separarlo dal bg */
    .chip-dot {
      width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid #fff;
      box-sizing: border-box;
    }
    /* Chip label: Bold 14px lh 14px */
    .chip-label {
      font-weight: 700; font-size: 14px; line-height: 14px;
      color: rgb(111,124,119); white-space: nowrap;
      transition: color 0.12s;
    }
    .cer-chip.active .chip-label { color: #fff; }

    /* ── CACER section — nessun overflow, le ombre escono liberamente ── */
    .cacer-section { display: flex; flex-direction: column; gap: 0; flex: 1; min-height: 0; }

    /* "Cacer" heading — padding orizzontale proprio */
    .cacer-title {
      font-weight: 700; font-size: 16px; line-height: 27px;
      color: rgb(0,27,16); flex-shrink: 0;
      padding: 0 32px;
    }

    /* Scroll wrapper — padding 16px top (gap titolo↔griglia), 32px sides (shadow room), 120px bottom per footer */
    .cacer-scroll {
      flex: 1; overflow-y: auto; min-height: 0;
      padding: 16px 32px 120px;
      scrollbar-width: thin; scrollbar-color: rgb(220,224,222) transparent;
    }
    .cacer-scroll::-webkit-scrollbar { width: 4px; }
    .cacer-scroll::-webkit-scrollbar-thumb { background: rgb(220,224,222); border-radius: 100px; }

    /* Card grid: responsive 5–7 cols × 163px, gap 10 */
    .cacer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, 163px);
      gap: 10px;
    }

    /* Card — Figma 40000638:6258 — 163×129, radius 10, flex-col gap 12, pb 16 */
    .cacer-card {
      width: 163px; height: 129px;
      background: #fff;
      border-radius: 10px;
      border: 2px solid transparent;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);        /* default: spread 0, alpha 0.05 */
      display: flex; flex-direction: column;
      gap: 12px;
      padding-bottom: 16px;
      cursor: pointer; user-select: none;
      transition: border-color 0.12s, box-shadow 0.12s;
      overflow: hidden;
    }
    /* hover unselected: spread 2, alpha 0.06 */
    .cacer-card:not(.selected):hover {
      box-shadow: 0 0 20px 2px rgba(0,0,0,0.06);
    }
    /* selected: green border + green glow spread 2, alpha 0.15 */
    .cacer-card.selected {
      border-color: rgb(6,101,62);
      box-shadow: 0 0 20px 2px rgba(15,169,105,0.15);
    }
    /* hover selected: shadow resta identica a selected (glow verde invariato) */
    .cacer-card.selected:hover {
      box-shadow: 0 0 20px 2px rgba(15,169,105,0.15);
    }

    /* Upper row: items-end, justify-between, pt 4, px 8 */
    .card-upper {
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 4px 8px 0;
      flex-shrink: 0;
    }
    /* Spacer: mirrors button width to center dot — 28×29px */
    .card-spacer { width: 28px; height: 29px; flex-shrink: 0; }
    /* Dot: 13.649px ≈ 14px, 2px white border */
    .card-dot {
      width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid #fff; box-sizing: border-box;
    }
    /* Button: 28×28, p 6px, radius 100 */
    .card-btn {
      width: 28px; height: 28px; border-radius: 100px;
      border: none; background: transparent;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; cursor: pointer; transition: background 0.12s;
      padding: 6px;
    }
    .cacer-card:not(.selected):hover .card-btn { background: rgb(230,233,232); }
    .cacer-card.selected .card-btn { background: transparent; }
    .cacer-card.selected:hover .card-btn { background: rgb(230,233,232); }

    /* Content: h 68px, px 6px, gap 12 between info and cer-name */
    .card-content {
      height: 68px;
      display: flex; flex-direction: column; gap: 12px;
      padding: 0 6px;
    }
    /* Info block: gap 4, items-center, justify-center */
    .card-info {
      display: flex; flex-direction: column; gap: 4px;
      align-items: center; justify-content: center;
      flex: 1;
    }
    /* CACER name: body/md/bold — 700, 14px, lh 16px, tracking 0.28px */
    .card-name {
      font-weight: 700; font-size: 14px; line-height: 16px;
      letter-spacing: 0.28px;
      color: rgb(89,105,99);    /* text/on-alt/light #596963 */
      text-align: center;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
    }
    .cacer-card.selected .card-name { color: rgb(0,27,16); } /* text/default/dark */
    /* POD code: body/sm/regular — 400, 12px, lh 18px, color #001b10 */
    .card-pod {
      font-weight: 400; font-size: 12px; line-height: 18px;
      color: rgb(0,27,16); text-align: center;
    }
    /* CER name: body/sm/bold — 700, 12px, lh 18px, color #6f7c77 */
    .card-cer {
      font-weight: 700; font-size: 12px; line-height: 18px;
      color: rgb(111,124,119); text-align: center; width: 100%;
    }

    /* Empty state — Figma 40008928:53151 */
    .empty-state {
      grid-column: 1 / -1;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 56px 0;
    }
    .empty-state-text {
      font-family: 'Nunito Sans', sans-serif;
      font-weight: 400; font-size: 16px; line-height: 27px;
      color: rgb(89,105,99); white-space: nowrap;
    }

    /* ── Footer: pad 24/32, white, shadow elevation/lg, space-between ── */
    .modal-footer {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 24px 32px;
      background: #fff;
      box-shadow: 0 0 20px 2px rgba(0,27,16,0.10);
      display: flex; align-items: center; justify-content: space-between;
      overflow: hidden; flex-shrink: 0;
    }

    /* Left: Checkbox 24×24 + label — gap 4px */
    .footer-left { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
    /* Checkbox — Figma 40000638:6517 — container 24×24, icon 16×16 centered, hover radius 100 */
    .f-checkbox {
      width: 24px; height: 24px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 100px;
      transition: background 0.12s;
    }
    .footer-left:hover .f-checkbox { background: rgb(230,233,232); }
    .f-chk-off { display: block; }
    .f-chk-on  { display: none; }
    .footer-left.checked .f-chk-off { display: none; }
    .footer-left.checked .f-chk-on  { display: block; }
    /* Label: medium 500, 14px, dark */
    .f-checkbox-label {
      font-size: 14px; font-weight: 500; line-height: 14px;
      color: rgb(0,27,16); white-space: nowrap;
    }

    /* Right: gap 24px */
    .footer-right { display: flex; align-items: center; gap: 24px; }

    /* Counter: selected bold / sep / total light / tipology regular — gap 4px */
    .footer-count { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    /* selected: bold 14px, dark, tracking 0.28px */
    .f-num  { font-weight: 700; font-size: 14px; line-height: 16px; color: rgb(0,27,16); letter-spacing: 0.28px; }
    /* "/" : regular 14px, dark */
    .f-sep  { font-weight: 400; font-size: 14px; line-height: 20px; color: rgb(0,27,16); }
    /* total: regular 14px, light */
    .f-total{ font-weight: 400; font-size: 14px; line-height: 20px; color: rgb(111,124,119); }
    /* tipology: regular 14px, dark */
    .f-type { font-weight: 400; font-size: 14px; line-height: 20px; color: rgb(0,27,16); }

    /* Primary button: auto width, h 36, green, radius 100, pad 8/16, gap 10 */
    .btn-primary {
      height: 36px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 8px 16px;
      background: rgb(6,101,62); border: none;
      border-radius: 100px;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      font-family: 'Nunito Sans', sans-serif; font-weight: 700; font-size: 14px;
      color: #fff; cursor: pointer; white-space: nowrap;
      overflow: hidden; transition: background 0.12s; flex-shrink: 0;
    }
    .btn-primary:hover { background: rgb(2,40,26); }
    .btn-primary:disabled { background: rgb(200,208,204); cursor: not-allowed; }

    /* ── Success toast (save confirmation, outside modal) ── */
    .toast {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgb(0,27,16); color: #fff;
      padding: 12px 24px; border-radius: 88px;
      font-size: 14px; font-weight: 600;
      opacity: 0; transition: all 0.22s; z-index: 500;
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Snackbar (Figma: Modale/selettore → Snackbar) ── */
    /* Snackbar — Figma 40008887:75804 */
    .snackbar {
      position: absolute; bottom: 100px; left: 50%;
      transform: translateX(-50%);
      background: rgb(0,27,16);           /* surface/default-alt-dark */
      border-radius: 20px;
      box-shadow: 0 4px 5px rgba(0,27,16,0.20); /* elevation/xl */
      padding: 14px 16px 14px 24px;       /* py:14 pl:24 pr:16 */
      display: flex; align-items: center; gap: 20px;
      opacity: 0; transition: opacity 250ms ease-out; /* uscita: fade out */
      pointer-events: none; white-space: nowrap; z-index: 200;
    }
    /* entrata: dissolve — delay 500ms, 250ms ease-in */
    .snackbar.show { opacity: 1; transition: opacity 250ms ease-in 500ms; pointer-events: auto; }
    /* Content: icon + text, gap 10 */
    .snackbar-content { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    /* IconBolouredBg error: 24×24 circle bg #fee6e9, overflow clip */
    .snackbar-icon {
      width: 24px; height: 24px; border-radius: 100px;
      background: rgb(254,230,233);       /* surface/error/default-subtle */
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; overflow: hidden;
    }
    /* Text: Nunito Sans Regular 16px lh 27px white */
    .snackbar-text {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 16px; font-weight: 400; line-height: 27px;
      color: #fff;
    }
    /* Close btn: 40×40, padding 10px, radius full, white icon */
    .snackbar-close {
      width: 40px; height: 40px; border-radius: 100px;
      border: none; background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: #fff; padding: 10px;
      transition: background 0.12s;
    }
    .snackbar-close:hover { background: rgba(255,255,255,0.10); }
  </style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="logo"></div>
  <span class="logo-name">Enercade</span>
  <nav class="topbar-nav">
    <div class="nav-item active">Home</div>
    <div class="nav-item">Monitoraggio</div>
    <div class="nav-item">Gestione</div>
    <div class="nav-item">Community</div>
    <div class="nav-item">Strumenti</div>
  </nav>
  <div class="topbar-right">
    <button class="open-btn" onclick="openModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Modifica selezione
    </button>
  </div>
</div>

<!-- Page content -->
<div class="page-body">
  <div class="dash-card tall"></div>
  <div class="dash-card wide"></div>
  <div class="dash-card"></div>
  <div class="dash-card"></div>
  <div class="dash-card wide"></div>
  <div class="dash-card"></div>
</div>

<!-- Scrim + Modal -->
<div class="scrim" id="scrim" style="display:none" onclick="onScrimClick(event)">
  <div class="modal" onclick="event.stopPropagation()">

    <!-- Header -->
    <div class="modal-header">
      <div class="modal-title">Selettore</div>
      <div class="header-right">
        <div class="searchbar" id="searchbar">
          <span class="searchbar-icon">
            <!-- search-md — Figma 40005270:11905 — path esatto, centrato nel container 20×20 -->
            <svg width="20" height="20" viewBox="-4.107 -4.107 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">

<script>
/* ── Icons SVG — always green, no currentColor dependency ── */
/* add(circle)-lg — Figma asset 0f5db724, viewBox 13.333×13.333, fill #06653E */
const ICO_PLUS = `<svg width="16" height="16" viewBox="0 0 13.3333 13.3333" fill="#06653E" xmlns="http://www.w3.org/2000/svg"><path d="M6 10H7.33333V7.33333H10V6H7.33333V3.33333H6V6H3.33333V7.33333H6V10ZM6.66667 13.3333C5.74444 13.3333 4.87778 13.1583 4.06667 12.8083C3.25556 12.4583 2.55 11.9833 1.95 11.3833C1.35 10.7833 0.875 10.0778 0.525 9.26667C0.175 8.45556 0 7.58889 0 6.66667C0 5.74444 0.175 4.87778 0.525 4.06667C0.875 3.25556 1.35 2.55 1.95 1.95C2.55 1.35 3.25556 0.875 4.06667 0.525C4.87778 0.175 5.74444 0 6.66667 0C7.58889 0 8.45556 0.175 9.26667 0.525C10.0778 0.875 10.7833 1.35 11.3833 1.95C11.9833 2.55 12.4583 3.25556 12.8083 4.06667C13.1583 4.87778 13.3333 5.74444 13.3333 6.66667C13.3333 7.58889 13.1583 8.45556 12.8083 9.26667C12.4583 10.0778 11.9833 10.7833 11.3833 11.3833C10.7833 11.9833 10.0778 12.4583 9.26667 12.8083C8.45556 13.1583 7.58889 13.3333 6.66667 13.3333ZM6.66667 12C8.15556 12 9.41667 11.4833 10.45 10.45C11.4833 9.41667 12 8.15556 12 6.66667C12 5.17778 11.4833 3.91667 10.45 2.88333C9.41667 1.85 8.15556 1.33333 6.66667 1.33333C5.17778 1.33333 3.91667 1.85 2.88333 2.88333C1.85 3.91667 1.33333 5.17778 1.33333 6.66667C1.33333 8.15556 1.85 9.41667 2.88333 10.45C3.91667 11.4833 5.17778 12 6.66667 12Z"/></svg>`;
/* remove-circle-md — Figma asset 3aa3ad82, viewBox 12.002×12.002, size 12px, fill #06653E */
const ICO_MINUS = `<svg width="16" height="16" viewBox="0 0 12.0022 12.0022" fill="#06653E" xmlns="http://www.w3.org/2000/svg"><path d="M3.00055 6.60121H9.00165V5.40099H3.00055V6.60121ZM6.0011 12.0022C5.17095 12.0022 4.3908 11.8447 3.66067 11.5296C2.93054 11.2146 2.29542 10.787 1.75532 10.2469C1.21522 9.70678 0.787644 9.07166 0.472587 8.34153C0.157529 7.61139 0 6.83125 0 6.0011C0 5.17095 0.157529 4.3908 0.472587 3.66067C0.787644 2.93054 1.21522 2.29542 1.75532 1.75532C2.29542 1.21522 2.93054 0.787644 3.66067 0.472587C4.3908 0.157529 5.17095 0 6.0011 0C6.83125 0 7.61139 0.157529 8.34153 0.472587C9.07166 0.787644 9.70678 1.21522 10.2469 1.75532C10.787 2.29542 11.2146 2.93054 11.5296 3.66067C11.8447 4.3908 12.0022 5.17095 12.0022 6.0011C12.0022 6.83125 11.8447 7.61139 11.5296 8.34153C11.2146 9.07166 10.787 9.70678 10.2469 10.2469C9.70678 10.787 9.07166 11.2146 8.34153 11.5296C7.61139 11.8447 6.83125 12.0022 6.0011 12.0022ZM6.0011 10.802C7.34134 10.802 8.47655 10.3369 9.40672 9.40672C10.3369 8.47655 10.802 7.34134 10.802 6.0011C10.802 4.66085 10.3369 3.52565 9.40672 2.59548C8.47655 1.6653 7.34134 1.20022 6.0011 1.20022C4.66085 1.20022 3.52565 1.6653 2.59548 2.59548C1.6653 3.52565 1.20022 4.66085 1.20022 6.0011C1.20022 7.34134 1.6653 8.47655 2.59548 9.40672C3.52565 10.3369 4.66085 10.802 6.0011 10.802Z"/></svg>`;

/* ── Data ── */
const CERS = [
  {
    id: 'alveo', name: 'Alveo', color: 'rgb(106,143,214)',
    cacers: [
      'EnerVita|AC018E00045','Mirafiori verde|AC041E00172','Barriera di Milano|AC020E00008',
      'TerrEnergia|AC027E00091','Raggio Verde|AC024E00079','Lingotto Solare|AC038E00047',
      'Eco Cream|AC023E00034','Verdea|AC025E00022','Green Pozzo Strada|AC037E00099',
      'TerrEnergia 2|AC027E00091','Bio Energia Nord|AC031E00015','Falchera Bio|AC040E00073',
      'Rinascente|AC023E00034','Falchera Bio 2|AC040E00073','EnerQuartiere Centro|AC031E00088',
      'Helionet|AC044E00012','Parella|AC038E00201','Cavoretto Collina|AC019E00034',
      'Eco Vento|AC055E00078','SoleComune|AC017E00044','Via Playa 12|AC022E00091',
      'Borgo Po|AC016E00055','Mirafiori Sud|AC041E00204','CasaVerde|AC029E00037',
      'Energia Reale|AC033E00066','Vanchiglia Sole|AC021E00019','Aurora Nord|AC014E00082',
      'Bertolla Energia|AC026E00047','Pozzo Strada Sud|AC037E00108','Campidoglio Verde|AC042E00011',
      'Rebaudengo Solare|AC035E00099','Sassi Energia|AC018E00203',
    ].map(s => { const [name, pod] = s.split('|'); return { name, pod }; })
  },
  {
    id: 'luceinrete', name: 'LuceInRete', color: 'rgb(239,68,68)',
    cacers: Array.from({length:27}, (_,i) => ({ name:`LuceInRete ${String.fromCharCode(65+i%26)}${i>25?'2':''}`, pod:`LR${String(i+1).padStart(3,'0')}E00001` }))
  },
  {
    id: 'enercoop', name: 'EnerCoop Torino', color: 'rgb(234,179,8)',
    cacers: Array.from({length:18}, (_,i) => ({ name:`EnerCoop ${String.fromCharCode(65+i)}`, pod:`ET${String(i+1).padStart(3,'0')}E00001` }))
  }
];

/* ── State ── */
let selected = new Set(); // "cerIdx-cacerIdx"
let activeCer = CERS[0].id;
let activatedCers = new Set([CERS[0].id]); // CER visitate → incluse in "Tutte"
let searchQ = '';

// Stato iniziale: prima CACER di Alveo selezionata
selected.add('0-0');

/* ── Derived ── */
function totalAll() { return CERS.reduce((s,c) => s + c.cacers.length, 0); }
function visibleItems() {
  const q = searchQ.toLowerCase();
  // In "Tutte" mostra solo le CER già visitate; altrimenti la singola CER attiva
  const cerList = activeCer === 'tutte'
    ? CERS.filter(c => activatedCers.has(c.id))
    : [CERS.find(c => c.id === activeCer)].filter(Boolean);

  const out = [];
  cerList.forEach(cer => {
    const ci = CERS.indexOf(cer);
    cer.cacers.forEach((ca, j) => {
      const key = `${ci}-${j}`;
      if (!q || ca.name.toLowerCase().includes(q) || ca.pod.toLowerCase().includes(q))
        out.push({ cer, ci, cacer: ca, j, key });
    });
  });

  if (activeCer === 'tutte') {
    const allSel = out.length > 0 && out.every(o => selected.has(o.key));
    if (allSel) {
      // Tutte selezionate → raggruppa per CER (ordine naturale)
      return out;
    }
    // Altrimenti: selezionate prima (da CER miste), poi non selezionate per CER
    const sel   = out.filter(o =>  selected.has(o.key));
    const unsel = out.filter(o => !selected.has(o.key));
    return [...sel, ...unsel];
  }

  return out;
}
function allVisSelected() {
  const v = visibleItems();
  return v.length > 0 && v.every(o => selected.has(o.key));
}

/* ── Open / Close ── */
function openModal() {
  activeCer = CERS[0].id;
  activatedCers = new Set([CERS[0].id]); // reset: solo Alveo visibile in "Tutte"
  searchQ = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchbar').classList.remove('has-input', 'is-active', 'kb-focus');
  document.getElementById('scrim').style.display = 'flex';
  render();
}
function closeModal() { document.getElementById('scrim').style.display = 'none'; }
function onScrimClick(e) { if (e.target.id === 'scrim') closeModal(); }

/* ── Render ── */
function render() { renderChips(); renderGrid(); renderFooter(); }

function renderChips() {
  const el = document.getElementById('cerChips');
  el.innerHTML = '';
  document.getElementById('cerTitle').textContent = 'Cer';

  const all = chip(null, 'Tutte', activeCer === 'tutte');
  all.onclick = () => selectCer('tutte');
  el.appendChild(all);

  CERS.forEach(cer => {
    const c = chip(cer.color, `${cer.name} (${cer.cacers.length})`, activeCer === cer.id);
    c.onclick = () => selectCer(cer.id);
    el.appendChild(c);
  });
}

function chip(color, label, active) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'cer-chip' + (active ? ' active' : '');
  let inner = '';
  if (color) inner += `<span class="chip-dot" style="background:${color}"></span>`;
  inner += `<span class="chip-label">${esc(label)}</span>`;
  btn.innerHTML = inner;
  return btn;
}

function renderGrid() {
  const grid = document.getElementById('cacerGrid');
  const items = visibleItems();
  if (!items.length) {
    grid.innerHTML = `<div class="empty-state">
      <svg width="20" height="20" viewBox="0 0 16.625 16.625" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15.3319 16.625L9.51317 10.8062C9.05137 11.1757 8.52029 11.4681 7.91995 11.6837C7.3196 11.8992 6.68077 12.0069 6.00346 12.0069C4.32557 12.0069 2.90552 11.4258 1.74331 10.2636C0.581104 9.1014 0 7.68135 0 6.00346C0 4.32557 0.581104 2.90552 1.74331 1.74331C2.90552 0.581104 4.32557 0 6.00346 0C7.68135 0 9.1014 0.581104 10.2636 1.74331C11.4258 2.90552 12.0069 4.32557 12.0069 6.00346C12.0069 6.68077 11.8992 7.3196 11.6837 7.91995C11.4681 8.52029 11.1757 9.05137 10.8062 9.51317L16.625 15.3319L15.3319 16.625ZM6.00346 10.1597C7.15797 10.1597 8.1393 9.75562 8.94746 8.94746C9.75562 8.1393 10.1597 7.15797 10.1597 6.00346C10.1597 4.84895 9.75562 3.86761 8.94746 3.05945C8.1393 2.2513 7.15797 1.84722 6.00346 1.84722C4.84895 1.84722 3.86761 2.2513 3.05945 3.05945C2.2513 3.86761 1.84722 4.84895 1.84722 6.00346C1.84722 7.15797 2.2513 8.1393 3.05945 8.94746C3.86761 9.75562 4.84895 10.1597 6.00346 10.1597Z" fill="#596963"/>
      </svg>
      <span class="empty-state-text">Nessun risultato${searchQ ? ` per &ldquo;${esc(searchQ)}&rdquo;` : ''}</span>
    </div>`;
    return;
  }
  const showCer = activeCer === 'tutte';
  grid.innerHTML = items.map(({ cer, cacer, key }) => {
    const sel = selected.has(key);
    return `
    <div class="cacer-card${sel ? ' selected' : ''}" onclick="toggleCard('${key}')">
      <div class="card-upper">
        <div class="card-spacer"></div>
        <div class="card-dot" style="background:${cer.color}"></div>
        <button class="card-btn" onclick="event.stopPropagation();toggleCard('${key}')">
          ${sel ? ICO_MINUS : ICO_PLUS}
        </button>
      </div>
      <div class="card-content">
        <div class="card-info">
          <div class="card-name">${esc(cacer.name)}</div>
          <div class="card-pod">${esc(cacer.pod)}</div>
        </div>
        ${showCer ? `<div class="card-cer">${esc(cer.name)}</div>` : `<div class="card-cer">${esc(cer.name)}</div>`}
      </div>
    </div>`;
  }).join('');
}

function renderFooter() {
  // Counter: per-CER when on a specific CER, global when on "Tutte"
  let sel, total;
  if (activeCer === 'tutte') {
    sel   = selected.size;
    total = totalAll();
  } else {
    const ci = CERS.findIndex(c => c.id === activeCer);
    const cerKeys = CERS[ci].cacers.map((_, j) => `${ci}-${j}`);
    sel   = cerKeys.filter(k => selected.has(k)).length;
    total = CERS[ci].cacers.length;
  }

  const allV = allVisSelected();
  const items = visibleItems();

  // Checkbox: toggle .checked on the label (drives SVG swap via CSS)
  document.getElementById('footerLeft').classList.toggle('checked', allV && items.length > 0);

  // Count
  document.getElementById('footerCount').innerHTML =
    `<span class="f-num">${sel}</span>
     <span class="f-sep">/</span>
     <span class="f-total">${total}</span>
     <span class="f-type">&nbsp;Cacer selezionate</span>`;

  // Save always enabled (at least 1 is always selected)
  document.getElementById('btnSave').disabled = false;
}

/* ── Actions ── */
function selectCer(id) {
  activeCer = id;
  // la ricerca resta attiva — non si azzera cambiando CER
  if (id !== 'tutte') {
    activatedCers.add(id); // registra la CER come visitata → compare in "Tutte"
    // Assicura ≥1 CACER selezionata nella CER
    const ci = CERS.findIndex(c => c.id === id);
    const hasSel = CERS[ci].cacers.some((_, j) => selected.has(`${ci}-${j}`));
    if (!hasSel) selected.add(`${ci}-0`);
  }
  render();
}

function toggleCard(key) {
  if (selected.has(key)) {
    // Min-1 rule: per-CER when viewing a specific CER, global when on "Tutte"
    if (activeCer !== 'tutte') {
      const ci = CERS.findIndex(c => c.id === activeCer);
      const cerKeys = CERS[ci].cacers.map((_, j) => `${ci}-${j}`);
      const selInCer = cerKeys.filter(k => selected.has(k));
      if (selInCer.length === 1 && selInCer[0] === key) {
        showSnackbar('Devi selezionare almeno una Cacer');
        return;
      }
    } else {
      if (selected.size === 1) {
        showSnackbar('Devi selezionare almeno una Cacer');
        return;
      }
    }
    selected.delete(key);
  } else {
    selected.add(key);
  }
  renderChips();
  renderGrid();
  renderFooter();
}

function toggleSelectAll() {
  const items = visibleItems();
  const allSel = allVisSelected();
  if (allSel) {
    if (activeCer !== 'tutte') {
      // Per-CER: always keep at least the first item selected
      items.slice(1).forEach(o => selected.delete(o.key));
    } else {
      // "Tutte" view: keep ≥1 globally
      const remaining = [...selected].filter(k => !items.some(o => o.key === k));
      if (remaining.length === 0) {
        items.slice(1).forEach(o => selected.delete(o.key));
      } else {
        items.forEach(o => selected.delete(o.key));
      }
    }
  } else {
    // Select all visible CACERs of current view
    items.forEach(o => selected.add(o.key));
  }
  renderGrid();
  renderFooter();
}

function onSearch(v) {
  searchQ = v;
  const sb = document.getElementById('searchbar');
  sb.classList.add('is-active');
  sb.classList.toggle('has-input', v.length > 0);
  renderGrid();
  renderFooter();
}

function clearSearch() {
  const inp = document.getElementById('searchInput');
  const sb  = document.getElementById('searchbar');
  inp.value = '';
  sb.classList.remove('has-input', 'is-active', 'kb-focus');
  searchQ = '';
  renderGrid();
  renderFooter();
}

/* ── Searchbar state machine ── */
(function initSearchbar() {
  const sb  = document.getElementById('searchbar');
  const inp = document.getElementById('searchInput');
  let fromMouse = false;

  // Click → active (subito, prima del focus)
  sb.addEventListener('mousedown', () => {
    fromMouse = true;
    sb.classList.add('is-active');
  });

  // Focus: se arriva da tab → kb-focus; se da mouse o programmatico → niente
  inp.addEventListener('focus', () => {
    if (!fromMouse) {
      // Controlla se il browser ritiene che il focus sia da tastiera
      requestAnimationFrame(() => {
        if (inp.matches(':focus-visible')) sb.classList.add('kb-focus');
      });
    }
    fromMouse = false;
  });

  // Blur: rimuovi kb-focus; rimuovi is-active solo se campo vuoto
  inp.addEventListener('blur', () => {
    sb.classList.remove('kb-focus');
    if (!inp.value) sb.classList.remove('is-active');
  });

  // Escape: svuota e torna a default
  inp.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      inp.value = '';
      sb.classList.remove('is-active');
      onSearch('');
      inp.blur();
    }
  });
})();

function save() {
  const n = selected.size;
  closeModal();
  toast(`Selezione salvata — ${n} Cacer`);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2800);
}

function showSnackbar(msg) {
  const s = document.getElementById('snackbar');
  document.getElementById('snackbar-text').textContent = msg;
  s.classList.add('show');
  clearTimeout(s._t);
  s._t = setTimeout(() => s.classList.remove('show'), 3500);
}

function hideSnackbar() {
  const s = document.getElementById('snackbar');
  clearTimeout(s._t);
  s.classList.remove('show');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
openModal();
</script>
